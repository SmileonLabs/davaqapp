name: davaq-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-api: &api
  image: ${API_IMAGE:?DavaQ API_IMAGE is required}
  env_file:
    - .env
  logging: *logging

services:
  app:
    <<: *api
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
      PORT: "8080"
      INSTANCE_NAME: davaq-app
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 640m
    restart: unless-stopped

  web:
    image: caddy:2.10-alpine
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./artifacts/landing/dist/public:/srv/landing:ro
      - ./artifacts/mobile/web-build:/srv/app:ro
    networks:
      default:
      edge:
        aliases:
          - davaq-web
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?DavaQ Neo4j password is required}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 768m
    logging: *logging
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["pnpm", "--filter", "@workspace/db", "run", "migrate"]
    environment:
      PGOPTIONS: -c lock_timeout=5s -c statement_timeout=15min
    profiles: [tools]
    restart: "no"

  neo4j-init:
    <<: *api
    command: ["node", "artifacts/api-server/dist/scripts/initializeKnowledgeGraph.mjs"]
    profiles: [tools]
    restart: "no"

volumes:
  redis-data:
  neo4j-data:

networks:
  edge:
    external: true
    name: anotherme-prod_default
