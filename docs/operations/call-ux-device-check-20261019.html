<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DavaQ 38·57 통화 실기기 검증</title><style>body{font:16px/1.65 system-ui;max-width:900px;margin:40px auto;padding:0 20px;background:#faf9ff;color:#232337}label{display:block;padding:18px;margin:12px 0;border:1px solid #ddd;border-radius:16px;background:white}input{width:22px;height:22px;vertical-align:middle;margin-right:12px}p{margin:6px 0}#count{position:sticky;top:0;background:#eee8ff;padding:12px;border-radius:10px}</style><h1>통화 개선 실기기 검증</h1><p>iOS 1.0.0 (38) · Android 1.0.0 (57). 테스트 계정 2개·기기 2대로 양방향 확인합니다. 그룹 통화는 3개 계정으로 확인합니다.</p><p>실제 기기에서 확인한 항목만 체크하세요. 자동 테스트·브라우저 레이아웃 확인은 실제 카메라·마이크·블루투스 검증을 대신하지 않습니다. 실패 시 기기·OS·빌드, 통화 유형, 재현 순서와 시간을 알려 주세요.</p><p id="count"></p>
<label><input type="checkbox"><b>설치·계정</b><p>TestFlight 38 / Play 내부 테스트 57으로 업데이트하고 앱 설정의 빌드 번호를 확인합니다. 기존 테스트 계정으로 로그인합니다.</p></label>
<label><input type="checkbox"><b>자동 잠금 방지·해제</b><p>자동 잠금을 30초로 설정하고 음성·영상 통화를 각각 2분 이상 화면을 건드리지 않고 유지합니다. 앱이 전면이면 화면이 켜져 있어야 합니다. 통화를 축소해 채팅을 볼 때도 확인합니다. 통화 종료 후 원래 자동 잠금이 복구되어야 합니다. 수동 잠금·근접 센서 동작은 별개입니다.</p></label>
<label><input type="checkbox"><b>통화 시간·상태</b><p>발신 대기는 호출 상태, 연결 후에는 실제 통화 시간을 표시해야 합니다. 축소·복귀·재접속으로 같은 통화의 시간이 초기화되지 않아야 합니다.</p></label>
<label><input type="checkbox"><b>음성으로 받기</b><p>영상통화를 걸고 상대가 음성으로 받기를 누릅니다. 양방향 음성이 들리며 수신 기기 영상은 전송되지 않아야 합니다. 잠금 화면의 시스템 수락도 카메라 꺼짐으로 시작하는지 확인합니다.</p></label>
<label><input type="checkbox"><b>카메라 미리보기·권한</b><p>영상으로 받기 또는 통화 중 카메라 켜기를 누릅니다. 미리보기는 상대에게 보이지 않아야 하며 확인 후에만 전송되어야 합니다. 취소·권한 거절·권한 창 중 홈 이동·상대 통화 취소도 시험합니다. 늦게 허용해도 종료된 통화의 카메라가 남지 않아야 합니다.</p></label>
<label><input type="checkbox"><b>축소·복귀·읽던 위치</b><p>음성 통화 배너가 채팅 헤더·뒤로 버튼을 가리지 않는지 확인합니다. 과거 대화 스크롤 위치에서 통화 축소·복귀 후에도 같은 위치를 유지해야 합니다. 배너 복귀와 빨간 종료 버튼은 각각 별도로 동작해야 합니다.</p></label>
<label><input type="checkbox"><b>영상 제스처</b><p>내 영상 탭으로 상대·내 영상을 맞바꿉니다. 미리보기를 모서리로 끌어 옮기되 드래그만으로 영상이 바뀌면 안 됩니다. 주 영상을 눌러 조작 버튼 숨김·표시를 확인합니다. 축소 영상 이동·복귀도 확인합니다.</p></label>
<label><input type="checkbox"><b>오디오 출력·음소거</b><p>수화기·스피커·블루투스를 선택해 실제 양방향 소리를 확인합니다. 블루투스 해제 후 출력 복구, 음소거 후 내 목소리 차단과 다시 켜기 복구를 확인합니다.</p></label>
<label><input type="checkbox"><b>재접속·종료 경합</b><p>통화 중 Wi-Fi·셀룰러 전환 또는 5~10초 단절 후 복구합니다. 다시 연결 중 표시 후 소리·영상이 복구되어야 합니다. 복구 도중 종료하면 다시 살아나면 안 됩니다. 곧바로 새 통화를 걸어 이전 통화 정리가 새 통화를 끊거나 카메라를 끄지 않는지 확인합니다.</p></label>
<label><input type="checkbox"><b>그룹 통화</b><p>3개 계정으로 음성·영상 참여, 음성으로 받기, 카메라 미리보기·전환, 오디오 출력, 발언·음소거 표시를 확인합니다. 카메라를 끈 참여자도 목록에 보여야 합니다. 한 명이 나가도 다른 참여자의 통화는 유지되어야 합니다.</p></label>
<label><input type="checkbox"><b>종료·재시도</b><p>거절·발신 취소·부재중·연결 실패 상태를 각각 확인합니다. 종료 후 카메라·마이크·통화 알림이 정리되고 다시 전화하기를 눌렀을 때 새 통화가 한 번만 시작해야 합니다.</p></label>
<label><input type="checkbox"><b>채팅·동기화 회귀</b><p>통화 전·중·후 텍스트·사진·스티커 전송과 읽던 위치 복원을 확인합니다. 오프라인 메시지 전송 후 앱 종료·재연결 시 중복 없이 자동 전송되어야 합니다. 동일 계정 다른 기기의 수신·읽음도 확인합니다.</p></label>
<script>const boxes=[...document.querySelectorAll('input')];let saved=[];try{saved=JSON.parse(localStorage.getItem('davaq-call-38-57')||'[]')}catch{}function update(){document.getElementById('count').textContent=boxes.filter(x=>x.checked).length+' / '+boxes.length+' 완료'}boxes.forEach((b,i)=>{b.checked=!!saved[i];b.onchange=()=>{localStorage.setItem('davaq-call-38-57',JSON.stringify(boxes.map(x=>x.checked)));update()}});update()</script></html>
