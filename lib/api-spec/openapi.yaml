      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        {
          "200": { description: Missions, content: { application/json: { schema: { type: array, items: { type: object } } } } }
        }
    post:
      tags: [ fan-communities ]
      summary: Create a community mission
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "201": { description: Mission created } }
  /fan-missions/{id}/join:
    post:
      tags: [ fan-communities ]
      summary: Join a fan mission
      security: [ { bearerAuth: [] } ]
      parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { "200": { description: Mission joined } }

  /admin/profiles/{profileId}/status:
    patch:
      operationId: updateAdminCharacterProfileStatus
      tags: [ admin ]
      summary: Lock or reactivate a character profile
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: profileId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ status, reason ]
              properties:
                status: { type: string, enum: [ active, locked ] }
                reason: { type: string, minLength: 2, maxLength: 300 }
      responses:
        "200":
          description: Updated character profile
          content: { application/json: { schema: { $ref: "#/components/schemas/CharacterProfile" } } }
        "400": { description: Invalid profile status request }
        "403": { description: Administrator permission required }
        "404": { description: Character profile not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CallAttemptId:
      name: X-Call-Attempt-Id
      in: header
      required: false
      description: UUID shared by every stage of one client call attempt.
      schema: { type: string, format: uuid }
    CallOperationId:
      name: X-Idempotency-Key
      in: header
      required: false
      description: UUID that makes a terminal call-control operation replay-safe.
      schema: { type: string, format: uuid }

  schemas:
    DavaqError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required: []
      required:
        - message
    DavaqOk:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    DavaqListingInput:
      type: object
      properties:
        mode:
          type: string
          enum:
            - offer
            - want
        kind:
          type: string
          enum:
            - goods
            - service
            - experience
        category:
          type: string
          enum:
            - voice
            - photo
            - design
            - language
            - tech
            - music
            - goods
            - business
            - other
        title:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 3000
        wantedText:
          type: string
          maxLength: 500
        wantedCategories:
          type: array
          items:
            type: string
            enum:
              - voice
              - photo
              - design
              - language
              - tech
              - music
              - goods
              - business
              - other
        location:
          type: string
          maxLength: 80
        delivery:
          type: string
          enum:
            - online
            - offline
            - either
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 1440
        availableDays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        ev:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 100000
        imageKey:
          type:
            - string
            - "null"
        terms:
          type: string
          maxLength: 1500
        status:
          type: string
          enum:
            - draft
            - published
            - paused
            - closed
        version:
          type: integer
          minimum: 1
        requestKey:
          type: string
          minLength: 8
          maxLength: 100
      required:
        - mode
        - kind
        - category
        - title
      additionalProperties: false
    DavaqListing:
      type: object
      properties:
        mode:
          type: string
          enum:
            - offer
            - want
        kind:
          type: string
          enum:
            - goods
            - service
            - experience
        category:
          type: string
          enum:
            - voice
            - photo
            - design
            - language
            - tech
            - music
            - goods
            - business
            - other
        title:
