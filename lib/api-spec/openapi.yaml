  /exchange/listings:
    get:
      operationId: davaqListListings
      tags:
        - davaq-exchange
      summary: ListListings
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum:
              - goods
              - service
              - experience
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum:
              - voice
              - photo
              - design
              - language
              - tech
              - music
              - goods
              - business
              - other
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum:
              - offer
              - want
        - name: mine
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: today
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: short
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: delivery
          in: query
          required: false
          schema:
            type: string
            enum:
