  /clan-wars/{id}/complete:
    post:
      operationId: completeClanWar
      tags: [ clan-wars ]
      summary: Judge and finalize a war (owner/elder of either clan)
      description: >
        Requires both sides to have at least one submission. Calls the AI judge exactly once to score every submission,
        derives each clan's score as the top-3 average, records the winner and result, and applies small isolated
        clan-EXP rewards. Idempotent — repeat calls return the completed war.
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The completed war
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanWarDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not an owner/elder of a participating clan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanError"
        "404":
          description: War not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanError"
        "409":
          description: Not ready to complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanError"
        "502":
          description: AI judge failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanError"

