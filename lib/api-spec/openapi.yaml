        "401":
          description: Unauthorized
        "403":
          description: Not allowed to view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanError"
        "404":
          description: War not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanError"

