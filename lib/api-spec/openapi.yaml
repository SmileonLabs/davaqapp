              - offline
        - name: location
          in: query
          required: false
          schema:
            type: string
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DavaqListings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
