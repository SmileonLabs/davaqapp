          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 3000
        wantedText:
          type: string
          maxLength: 500
        wantedCategories:
          type: array
          items:
            type: string
            enum:
              - voice
              - photo
              - design
              - language
              - tech
              - music
              - goods
              - business
              - other
        location:
