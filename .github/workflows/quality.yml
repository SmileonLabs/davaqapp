name: Quality

on:
  pull_request:
  push:

jobs:
  api-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: davaq
          POSTGRES_USER: davaq
          POSTGRES_PASSWORD: davaq-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U davaq -d davaq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://davaq:davaq-ci@127.0.0.1:5432/davaq
      REDIS_URL: redis://127.0.0.1:6379
      RUN_INFRA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:tracked-files
      - run: pnpm --filter @workspace/db run migrate
      - run: node artifacts/api-server/tests/build-davaq-integration.mjs
      - run: node artifacts/api-server/.davaq-integration/test.mjs
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-client-react run test:reliability
      - run: pnpm --filter @workspace/mobile run test:reliability
      - run: pnpm --filter @workspace/mobile run test:call-plugin
      - run: pnpm --filter @workspace/api-server exec vitest --root ../.. run artifacts/mobile/lib/callApi.owner.test.ts
      - run: pnpm --filter @workspace/api-server exec vitest --root ../mobile run lib/voiceCall.web.test.ts
      - run: node --experimental-strip-types --test artifacts/mobile/lib/callVideoPlayback.test.ts
      - run: pnpm --filter @workspace/api-server run typecheck
      - run: pnpm --filter @workspace/api-server test
      - run: pnpm run typecheck

  production-builds:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      PORT: "4173"
      PWA_ORIGIN: https://ci.davaq.invalid
      PWA_BASE_PATH: /app
      EXPO_PUBLIC_DOMAIN: ci.davaq.invalid
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/landing run build
      - run: pnpm --filter @workspace/mockup-sandbox run build
      - run: pnpm --filter @workspace/mobile run build
