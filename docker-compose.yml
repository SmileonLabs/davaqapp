name: davaq-local

x-api-image: &api-image
  image: davaq-api:local
  build:
    context: .
    dockerfile: docker/api.Dockerfile

x-api-env: &api-env
  NODE_ENV: production
  PORT: "8080"
  DATABASE_URL: postgres://davaq:davaq@postgres:5432/davaq
  REDIS_URL: redis://redis:6379
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://davaqai.app}
  S3_BUCKET: davaq-objects
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY_ID: davaq
  S3_SECRET_ACCESS_KEY: davaq-password
  S3_FORCE_PATH_STYLE: "true"
  S3_PRIVATE_PREFIX: private
  S3_PUBLIC_PREFIXES: public
  CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
  CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@davaq.app}
  FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  app-a:
    <<: *api-image
    environment:
      <<: *api-env
      INSTANCE_NAME: app-a
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app-b:
    <<: *api-image
    environment:
      <<: *api-env
      INSTANCE_NAME: app-b
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *api-image
    command: ["pnpm", "--filter", "@workspace/db", "run", "push:dev"]
    environment:
      DATABASE_URL: postgres://davaq:davaq@postgres:5432/davaq
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: davaq
      POSTGRES_USER: davaq
      POSTGRES_PASSWORD: davaq
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davaq -d davaq"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: davaq
      MINIO_ROOT_PASSWORD: davaq-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 davaq davaq-password && mc mb --ignore-existing local/davaq-objects && (mc anonymous set download local/davaq-objects/public || true)
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  minio-data:
